<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Litoral de João Pessoa &amp; Cabedelo</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* ─── reset ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }

    /* ─── poster wrapper: poster + side button ───────── */
    .poster-wrap {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    /* ─── poster ──────────────────────────────────── */
    .poster {
      position: relative;
      width: 700px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(0,0,0,.7);
      padding: 28px 28px 20px;
      border: 1px solid #d4c9a8;
    }

    /* decorative double border */
    .poster::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1.5px solid #b8a878;
      pointer-events: none;
      z-index: 10;
    }

    /* ─── header ─────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 14px;
      z-index: 5;
      position: relative;
    }

    .header .eyebrow {
      font-family: 'Georgia', serif;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #8b7355;
      margin-bottom: 4px;
    }

    .header h1 {
      font-family: 'Georgia', serif;
      font-size: 34px;
      font-weight: normal;
      color: #1a3a5c;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .header h1 span {
      font-size: 20px;
      display: block;
      letter-spacing: 4px;
      color: #5a8a6a;
      margin-top: 2px;
    }

    .header .subtitle {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8b7355;
      margin-top: 6px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #b8a878, transparent);
    }
    .divider-icon { color: #b8a878; font-size: 14px; }

    /* ─── map container ───────────────────────────── */
    .map-frame {
      position: relative;
      width: 100%;
      /* 4:3 ratio → altura = largura × (3/4) */
      height: 480px;
      border: 1px solid #c8b890;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* vignette overlay */
    .map-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 55%,
        rgba(26,20,10,.25) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* corner decorations */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      z-index: 3;
      pointer-events: none;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 7px; left: 7px; }
    .corner.tr { top: 7px; right: 7px; transform: scaleX(-1); }
    .corner.bl { bottom: 7px; left: 7px; transform: scaleY(-1); }
    .corner.br { bottom: 7px; right: 7px; transform: scale(-1,-1); }

    /* ─── custom map controls ──────────────────────── */
    .maplibregl-ctrl-group {
      background: rgba(255,255,255,.88) !important;
      border: 1px solid #b8a878 !important;
      border-radius: 3px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.2) !important;
    }
    .maplibregl-ctrl-group button {
      color: #1a3a5c !important;
    }
    .maplibregl-ctrl-attrib {
      background: rgba(255,255,255,.7) !important;
      font-size: 9px !important;
    }



    /* compass rose */
    .compass {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      width: 52px;
      height: 52px;
    }

    /* ─── footer ──────────────────────────────────── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #d4c9a8;
      position: relative;
      z-index: 5;
    }
    .footer .coords {
      font-size: 9px;
      letter-spacing: 1px;
      color: #8b7355;
      font-family: 'Courier New', monospace;
      line-height: 1.7;
    }
    .footer .tagline {
      font-size: 11px;
      color: #2a5a3a;
      font-style: italic;
      text-align: right;
      line-height: 1.5;
    }
    .footer .scale-bar {
      font-size: 9px;
      color: #8b7355;
      text-align: center;
    }

    /* ─── print ───────────────────────────────────── */
    @media print {
      body { background: white; }
      .poster { box-shadow: none; width: 100% !important; }
      .save-btn { display: none !important; }
    }

    /* ─── save button ─────────────────────────────────── */
    .save-btn {
      background: transparent;
      border: 1px solid #b8a878;
      color: #b8a878;
      font-family: 'Georgia', serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      transition: all .25s;
      white-space: nowrap;
    }
    .save-btn:hover {
      background: #b8a878;
      color: #1a1a2e;
    }
    .save-btn:disabled {
      opacity: .5;
      cursor: wait;
    }
  </style>
</head>
<body>

  <div class="poster-wrap">
  <div class="poster">

    <!-- header -->
    <div class="header">
      <div class="eyebrow">Paraíba · Brasil</div>
      <h1>João Pessoa <span>&amp; Cabedelo</span></h1>
      <div class="divider"><span class="divider-icon">✦</span></div>
      <div class="subtitle">Litoral Atlântico &nbsp;·&nbsp; Costa das Praias</div>
    </div>

    <!-- map -->
    <div class="map-frame">
      <div id="map"></div>

      <!-- corner ornaments -->
      <div class="corner tl">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2 L2 12 M2 2 L12 2" stroke="#b8a878" stroke-width="2"/>
          <path d="M2 2 L8 8" stroke="#b8a878" stroke-width="1.5" opacity=".6"/>
        </svg>
      </div>
      <div class="corner tr">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M2 2 L2 12 M2 2 L12 2" stroke="#b8a878" stroke-width="2"/>
          <path d="M2 2 L8 8" stroke="#b8a878" stroke-width="1.5" opacity=".6"/>
        </svg>
      </div>
      <div class="corner bl">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M2 2 L2 12 M2 2 L12 2" stroke="#b8a878" stroke-width="2"/>
          <path d="M2 2 L8 8" stroke="#b8a878" stroke-width="1.5" opacity=".6"/>
        </svg>
      </div>
      <div class="corner br">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M2 2 L2 12 M2 2 L12 2" stroke="#b8a878" stroke-width="2"/>
          <path d="M2 2 L8 8" stroke="#b8a878" stroke-width="1.5" opacity=".6"/>
        </svg>
      </div>

      <!-- compass -->
      <div class="compass">
        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="28" fill="rgba(255,252,245,.85)" stroke="#b8a878" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="22" fill="none" stroke="#d4c9a8" stroke-width=".8" stroke-dasharray="3,3"/>
          <!-- N arrow -->
          <polygon points="30,5 33,28 30,25 27,28" fill="#1a3a5c"/>
          <!-- S arrow -->
          <polygon points="30,55 33,32 30,35 27,32" fill="#8b7355"/>
          <!-- E/W ticks -->
          <line x1="7" y1="30" x2="53" y2="30" stroke="#d4c9a8" stroke-width=".8"/>
          <text x="30" y="14" text-anchor="middle" font-size="8" font-family="Georgia" fill="#1a3a5c" font-weight="bold">N</text>
          <text x="30" y="52" text-anchor="middle" font-size="7" font-family="Georgia" fill="#8b7355">S</text>
          <text x="8"  y="33" text-anchor="middle" font-size="7" font-family="Georgia" fill="#8b7355">W</text>
          <text x="52" y="33" text-anchor="middle" font-size="7" font-family="Georgia" fill="#8b7355">E</text>
          <circle cx="30" cy="30" r="2.5" fill="#b8a878"/>
        </svg>
      </div>


    </div>

    <!-- footer -->
    <div class="footer">
      <div class="coords">
        7°06′S &nbsp;34°52′W<br>
        Fuso: UTC−3
      </div>
      <div class="scale-bar">
        <svg width="90" height="22" xmlns="http://www.w3.org/2000/svg">
          <line x1="5"  y1="8" x2="5"  y2="16" stroke="#8b7355" stroke-width="1.5"/>
          <line x1="5"  y1="12" x2="85" y2="12" stroke="#8b7355" stroke-width="1.5"/>
          <line x1="45" y1="8" x2="45" y2="16" stroke="#8b7355" stroke-width="1.5"/>
          <line x1="85" y1="8" x2="85" y2="16" stroke="#8b7355" stroke-width="1.5"/>
          <rect x="5" y="9" width="40" height="6" fill="#8b7355"/>
          <rect x="45" y="9" width="40" height="6" fill="white" stroke="#8b7355" stroke-width=".8"/>
          <text x="5"  y="22" font-size="8" font-family="Georgia" fill="#8b7355">0</text>
          <text x="38" y="22" font-size="8" font-family="Georgia" fill="#8b7355">5km</text>
          <text x="72" y="22" font-size="8" font-family="Georgia" fill="#8b7355">10km</text>
        </svg>
      </div>
      <div class="tagline">
        "Onde o sol nasce primeiro<br>nas praias do Brasil"
      </div>
    </div>

  </div>
  <button class="save-btn" id="save-webp-btn" onclick="saveImage('webp')">Salvar WEBP</button>
  </div>

  <script>
    /* ────────────────────────────────────────────────
       Paleta: inspirada em mapas antigos + mar tropical
    ──────────────────────────────────────────────── */
    const STYLE = {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sprite: 'https://demotiles.maplibre.org/styles/osm-bright-gl-style/sprite',
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxzoom: 19
        }
      },
      layers: [
        {
          id: 'osm-base',
          type: 'raster',
          source: 'osm',
          paint: {
            'raster-opacity': 1,
            // warm vintage tint: desaturate slightly, add sepia-like warm hue
            'raster-saturation': -0.15,
            'raster-contrast': 0.08,
            'raster-brightness-min': 0.0,
            'raster-brightness-max': 0.92,
            'raster-hue-rotate': 10      // subtle warm shift
          }
        }
      ]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: STYLE,
      center: [-34.855, -7.062],   // mostra toda a costa Formosa–Seixas com contexto urbano
      zoom: 10.63,
      bearing: 0,
      pitch: 0,
      attributionControl: false,
      preserveDrawingBuffer: true   // necessário para capturar canvas no print
    });

    map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: '' }), 'bottom-right');
    // força attribution colapsado após render
    map.once('idle', () => {
      const btn = document.querySelector('.maplibregl-ctrl-attrib-button');
      const ctrl = document.querySelector('.maplibregl-ctrl-attrib');
      if (ctrl && !ctrl.classList.contains('maplibregl-compact')) {
        ctrl.classList.add('maplibregl-compact');
      }
      if (ctrl && ctrl.classList.contains('maplibregl-compact-show')) {
        ctrl.classList.remove('maplibregl-compact-show');
      }
    });
    // NavigationControl removido (sem botoes +/- no mapa)

    /* ── Praias: de Formosa ao Seixas ─────────────────
       pin = posição exata na linha d'água (beira-mar)
    ─────────────────────────────────────────────── */
    const BEACHES = [
      { name: 'Praia de Formosa',     pin: [-34.830, -6.966] },
      { name: 'Ponta de Matos',       pin: [-34.828, -7.009] },
      { name: 'Praia de Camboinha',   pin: [-34.831, -7.028] },
      { name: 'Praia de Intermares',  pin: [-34.840, -7.054] },
      { name: 'Praia de Bessa',       pin: [-34.831, -7.073] },
      { name: 'Praia de Manaíra',     pin: [-34.836, -7.096] },
      { name: 'Praia de Tambaú',      pin: [-34.826, -7.117] },
      { name: 'Praia do Cabo Branco', pin: [-34.820426, -7.133472] },
      { name: 'Ponta do Seixas',      pin: [-34.793, -7.154] },
    ];

    map.on('load', () => {

      /* ── Rótulos direto ao lado do pin ── */
      map.addSource('beach-pins-src', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: BEACHES.map(b => ({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: b.pin },
            properties: { name: b.name }
          }))
        }
      });

      map.addLayer({
        id: 'beach-lbl-text',
        type: 'symbol',
        source: 'beach-pins-src',
        layout: {
          'text-field': ['get', 'name'],
          'text-font': ['Noto Sans Bold'],
          'text-size': 10.5,
          'text-anchor': 'left',
          'text-offset': [0.9, 0],
          'text-max-width': 12,
          'text-allow-overlap': true,
          'text-ignore-placement': true,
        },
        paint: {
          'text-color': '#6b2f0a',
          'text-halo-color': 'rgba(210,235,255,.9)',
          'text-halo-width': 1.8,
        }
      });

      map.addSource('cities-src', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: [
            { type: 'Feature',
              geometry: { type: 'Point', coordinates: [-34.862, -6.982] },
              properties: { name: 'CABEDELO' } },
            { type: 'Feature',
              geometry: { type: 'Point', coordinates: [-34.874, -7.118] },
              properties: { name: 'JOÃO PESSOA' } },
          ]
        }
      });

      map.addLayer({
        id: 'city-lbl-text',
        type: 'symbol',
        source: 'cities-src',
        layout: {
          'text-field': ['get', 'name'],
          'text-font': ['Noto Sans Bold'],
          'text-size': 13,
          'text-letter-spacing': 0.18,
          'text-anchor': 'center',
          'text-allow-overlap': false,
        },
        paint: {
          'text-color': '#1a3a5c',
          'text-halo-color': 'rgba(255,252,245,.95)',
          'text-halo-width': 2.2,
        }
      });

      /* ── Marcadores de praia na linha d'água ── */
      BEACHES.forEach(b => {
        const el = document.createElement('div');
        el.style.cssText = `
          width: 12px; height: 12px;
          background: #e07b39;
          border: 2px solid rgba(255,255,255,.9);
          border-radius: 50%;
          box-shadow: 0 1px 6px rgba(0,0,0,.45);
        `;
        new maplibregl.Marker({ element: el, anchor: 'center' })
          .setLngLat(b.pin)
          .addTo(map);
      });

    });

    /* ── Salvar como imagem ──────────────────────────────────────────────
       html2canvas captura o .poster inteiro (incluindo o canvas WebGL).
       Os controles do mapa são ocultados durante a captura.
    ─────────────────────────────────────────────────────────────────── */
    async function saveImage(fmt) {
      const btn = document.getElementById('save-webp-btn');
      btn.disabled = true;
      btn.textContent = '...';

      // oculta controles do mapa (attribution)
      const ctrls = document.querySelectorAll('.maplibregl-ctrl');
      ctrls.forEach(c => c.style.visibility = 'hidden');

      try {
        const mime = { png: 'image/png', webp: 'image/webp', jpg: 'image/jpeg' }[fmt];
        const canvas = await html2canvas(document.querySelector('.poster'), {
          useCORS: true,
          allowTaint: true,
          scale: 2,
          backgroundColor: '#ffffff',
          logging: false
        });

        const a = document.createElement('a');
        a.download = `joao-pessoa-cabedelo.${fmt}`;
        a.href = canvas.toDataURL(mime, 0.95);
        a.click();
      } finally {
        ctrls.forEach(c => c.style.visibility = '');
        btn.disabled = false;
        btn.textContent = 'Salvar WEBP';
      }
    }
  </script>
</body>
</html>
